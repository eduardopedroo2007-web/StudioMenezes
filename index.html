<style>
  :root{
    --bg:#f9fafb; --card:#ffffff; --brand:#5f8a2f; --brand-hover:#4f7527; --accent:#77a041;
    --text-main:#1f2937; --text-muted:#5b6472; --radius:16px;
    --border:rgba(0,0,0,.05); --ico-bg:#eef4e7; --go:#c3c9d1;
    --shadow:0 4px 15px rgba(0,0,0,.05); --btn-text:#fff; --neon:#9dff3a; --neon-soft:rgba(157,255,58,.35); --mint:#d9f2c2; color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#161b14; --card:#202720; --brand:#4f7a24; --brand-hover:#5d8d2c; --accent:#8fc255;
    --text-main:#e9eee5; --text-muted:#a4afa0;
    --border:rgba(255,255,255,.07); --ico-bg:rgba(143,194,85,.14); --go:#4a5646;
    --shadow:0 6px 20px rgba(0,0,0,.25); --neon:#b6ff5c; --neon-soft:rgba(182,255,92,.28); --mint:#a8e07a; color-scheme:dark;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    background:var(--bg); color:var(--text-main);
    font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; justify-content:center;
    min-height:100vh; min-height:100dvh;
    padding:calc(48px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    transition:background-color .5s ease,color .5s ease;
    overflow-x:hidden;
  }

  main{ position:relative; z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  /* ---------- Entrada orquestrada (uma vez, ao abrir) ---------- */
  .rise{ opacity:0; transform:translateY(18px); animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--i,0) * 90ms + 120ms); }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .logo-wrap{ position:relative; width:280px; max-width:100%; margin-bottom:12px; }
  .logo{ width:100%; height:auto; display:block; animation:float 7s ease-in-out infinite; filter:drop-shadow(0 0 14px var(--neon-soft)); }
  .logo-dark{ display:none; }
  :root[data-theme="dark"] .logo-light{ display:none; }
  :root[data-theme="dark"] .logo-dark{ display:block; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }

  .tagline{ font-size:.9rem; color:var(--text-muted); font-weight:500; margin-bottom:12px; display:flex; align-items:center; gap:8px; text-align:center; }
  .tagline svg{ width:16px; height:16px; color:var(--accent); flex-shrink:0; filter:drop-shadow(0 0 4px var(--neon-soft)); }

  .hours{
    display:inline-flex; align-items:center; gap:8px; font-size:.8rem; font-weight:600; color:var(--text-muted);
    background:var(--card); border:1px solid var(--border); border-radius:999px; padding:6px 14px; margin-bottom:28px;
  }
  .hours[hidden]{ display:none; }
  .hours i{ width:8px; height:8px; border-radius:50%; background:#9ca3af; }
  .hours.open i{ background:#22c55e; animation:blink 2s ease-in-out infinite; }
  .hours.closed i{ background:#ef4444; }
  @keyframes blink{ 0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,.55) } 50%{ box-shadow:0 0 0 6px rgba(34,197,94,0) } }
  .tagline + .spacer{ height:16px; }

  .links{ list-style:none; width:100%; display:flex; flex-direction:column; gap:14px; }

  .btn{
    position:relative; overflow:hidden; isolation:isolate;
    background:var(--card); text-decoration:none; color:var(--text-main);
    padding:16px 20px; border-radius:var(--radius);
    display:flex; align-items:center; gap:16px; width:100%; font:inherit; text-align:left; cursor:pointer;
    box-shadow:var(--shadow); border:1px solid var(--border);
    transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .5s ease;
  }
  .btn:hover,.btn:focus-visible{ transform:translateY(-3px); box-shadow:0 10px 25px rgba(95,138,47,.16),0 0 0 1px var(--neon-soft),0 0 18px -4px var(--neon-soft); border-color:rgba(157,255,58,.45); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  .btn:active{ transform:scale(.98); }

  /* brilho que passa ao tocar/passar o mouse */
  .btn::after{
    content:""; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);
    transform:translateX(-120%); transition:transform .7s ease;
  }
  .btn:hover::after,.btn:focus-visible::after{ transform:translateX(120%); }

  .btn.primary{ background:linear-gradient(135deg,var(--brand),var(--brand-hover)); color:#fff; box-shadow:0 8px 20px rgba(95,138,47,.32); border-color:transparent; animation:pulse 2.8s ease-in-out 1.6s infinite; }
  .btn.primary:hover,.btn.primary:focus-visible{ background:linear-gradient(135deg,var(--brand-hover),var(--brand)); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 8px 20px rgba(95,138,47,.32),0 0 14px -2px var(--neon-soft),0 0 0 0 var(--neon-soft) } 60%{ box-shadow:0 8px 20px rgba(95,138,47,.32),0 0 14px -2px var(--neon-soft),0 0 0 10px rgba(157,255,58,0) } }

  .ico{ box-shadow:inset 0 0 0 1px rgba(157,255,58,.18); display:grid; place-items:center; width:48px; height:48px; border-radius:12px; background:var(--ico-bg); color:var(--accent); flex-shrink:0; transition:transform .3s ease; }
  .btn:hover .ico{ transform:rotate(-6deg) scale(1.06); }
  .btn.primary .ico{ background:rgba(255,255,255,.2); color:#fff; }
  .ico svg{ width:24px; height:24px; }

  .txt{ display:flex; flex-direction:column; flex-grow:1; min-width:0; }
  .txt b{ font-weight:600; font-size:1.05rem; margin-bottom:2px; }
  .txt span{ font-size:.85rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn.primary .txt span{ color:rgba(255,255,255,.9); }

  .go{ width:20px; height:20px; color:var(--go); flex-shrink:0; transition:transform .2s ease,color .2s ease; }
  .btn:hover .go{ transform:translateX(4px); color:var(--accent); }
  .btn.primary .go{ color:rgba(255,255,255,.75); }

  .stars{ display:flex; gap:2px; margin-top:3px; }
  .stars svg{ width:14px; height:14px; color:#fbbf24; opacity:0; transform:scale(.4) rotate(-30deg); animation:star .5s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay:calc(var(--s) * 110ms + 1100ms); }
  @keyframes star{ to{ opacity:1; transform:none; } }

  .btn.done .ico{ background:var(--accent); color:#fff; }

  .address{ margin-top:32px; text-align:center; font-style:normal; font-size:.85rem; color:var(--text-muted); line-height:1.6; }
  .address strong{ display:block; color:var(--text-main); font-weight:600; margin-bottom:4px; }

  /* Fundo: ondas lentas (leves p/ celular) */
  .bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .waves{ position:absolute; left:0; right:0; bottom:0; height:60vh; overflow:hidden; opacity:1; transition:opacity .5s ease; }
  :root[data-theme="dark"] .waves{ opacity:.7; }
  .wave{ position:absolute; left:0; width:200%; display:block; animation:wslide linear infinite; will-change:transform; }
  .wave path{ fill:#b5e68a; }
  :root[data-theme="dark"] .wave path{ fill:#8cc257; }
  .w1{ bottom:-2vh; height:34vh; animation-duration:70s; }
  .w1 path{ fill-opacity:.30; }
  .w2{ bottom:9vh; height:30vh; animation-duration:100s; animation-direction:reverse; }
  .w2 path{ fill-opacity:.18; }
  .w3{ bottom:17vh; height:26vh; animation-duration:140s; animation-delay:-30s; }
  .w3 path{ fill:var(--neon); fill-opacity:.07; }
  .glow{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .glow.g1{ width:340px; height:340px; top:-120px; left:-100px; background:radial-gradient(circle,var(--mint),transparent 70%); animation:drift 24s ease-in-out infinite; }
  .glow.g2{ width:300px; height:300px; top:38%; right:-140px; background:radial-gradient(circle,var(--neon-soft),transparent 70%); animation:drift 30s ease-in-out infinite reverse; }
  :root[data-theme="dark"] .glow{ opacity:.35; }
  @keyframes drift{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(30px,40px) } }
  @keyframes wslide{ to{ transform:translateX(-50%); } }

  /* Botão de tema */
  .theme{
    position:fixed; top:max(16px,env(safe-area-inset-top)); right:16px; z-index:5;
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--card); color:var(--text-main); box-shadow:var(--shadow);
    display:grid; place-items:center; cursor:pointer;
    transition:transform .3s ease,background-color .5s ease,color .5s ease;
  }
  .theme:hover{ transform:scale(1.06) rotate(15deg); }
  .theme:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  .theme svg{ width:20px; height:20px; }
  .theme .sun{ display:none; }
  :root[data-theme="dark"] .theme .sun{ display:block; }
  :root[data-theme="dark"] .theme .moon{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:10;
    transform:translate(-50%,20px); opacity:0; pointer-events:none;
    background:var(--text-main); color:var(--bg); font-size:.85rem; font-weight:600;
    padding:10px 18px; border-radius:999px; transition:opacity .3s ease,transform .3s ease;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
    .rise,.stars svg{ opacity:1; transform:none; }
  }
  @media (max-width:360px){
    .btn{ padding:14px 16px; gap:12px; }
    .txt b{ font-size:.95rem; }
  }
</style>
</head>

<script>
  /* ============ EDITE AQUI ============ */
  const CONFIG = {
    whatsappNumero: "5534998767030",
    whatsappMensagem: "Olá, Fellipe! Vi seu site e gostaria de saber mais sobre o studio, planos e horários.",
    instagram: "https://www.instagram.com/fellipemenezespersonal",

    /* Place ID do Google (começa com ChIJ...). Se preencher, o botão abre direto a janela
       de avaliação com estrelas. Como achar: Google "Place ID Finder" e busque o studio. */
    googlePlaceId: "ChIJH76EbGh3o5QRKJu1E8mTv1I",
    googleFallback: "https://maps.google.com/maps/place//data=!4m2!3m1!1s0x94a377686c84be1f:0x52bf93c913b59b28?entry=s&hl=pt",

    endereco: "R. Jesus Vilela Oliveira, 94, Edna, Prata, MG, 38140-000",

    /* Horário de funcionamento (opcional). Deixe horarios = null para esconder o selo.
       Dias: 0=domingo, 1=segunda ... 6=sábado. Formato "HH:MM". Exemplo preenchido abaixo: */
    horarios: null
    /* horarios: { 1:["06:00","21:00"], 2:["06:00","21:00"], 3:["06:00","21:00"],
                   4:["06:00","21:00"], 5:["06:00","21:00"], 6:["08:00","12:00"] } */
  };
  /* ====================================== */

  const $ = id => document.getElementById(id);

  $("btn-whatsapp").href = "https://wa.me/" + CONFIG.whatsappNumero + "?text=" + encodeURIComponent(CONFIG.whatsappMensagem);
  $("btn-instagram").href = CONFIG.instagram;
  $("btn-google").href = CONFIG.googlePlaceId
    ? "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(CONFIG.googlePlaceId)
    : CONFIG.googleFallback;
  $("btn-route").href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(CONFIG.endereco);

  /* Toast */
  let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }

  /* Copiar endereço */
  $("btn-copy").addEventListener("click", async () => {
    const btn=$("btn-copy");
    let ok=false;
    try{ await navigator.clipboard.writeText(CONFIG.endereco); ok=true; }
    catch(e){
      try{ const ta=document.createElement("textarea"); ta.value=CONFIG.endereco; ta.style.position="fixed"; ta.style.opacity="0";
           document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); }catch(_){}
    }
    if(ok){ btn.classList.add("done"); $("copy-label").textContent="Copiado!"; toast("Endereço copiado");
      setTimeout(()=>{ btn.classList.remove("done"); $("copy-label").textContent="Copiar endereço"; },2200); }
    else toast("Não foi possível copiar");
  });

  /* Selo "Aberto agora / Fechado" */
  (function(){
    const H=CONFIG.horarios; if(!H) return;
    const el=$("hours"), txt=$("hours-txt"), now=new Date();
    const toMin=s=>{const[a,b]=s.split(":");return +a*60+ +b;};
    const cur=now.getHours()*60+now.getMinutes(), d=now.getDay(), today=H[d];
    const nomes=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
    let open=false;
    if(today && cur>=toMin(today[0]) && cur<toMin(today[1])) open=true;
    if(open){ el.classList.add("open"); txt.textContent="Aberto agora · até "+today[1].replace(":00","h").replace(":","h"); }
    else{
      el.classList.add("closed");
      let next=null;
      if(today && cur<toMin(today[0])) next=["hoje",today[0]];
      else for(let i=1;i<=7;i++){ const n=H[(d+i)%7]; if(n){ next=[i===1?"amanhã":nomes[(d+i)%7],n[0]]; break; } }
      txt.textContent="Fechado"+(next?" · abre "+next[0]+" às "+next[1].replace(":00","h").replace(":","h"):"");
    }
    el.hidden=false;
  })();

  /* Tema claro/escuro */
  (function(){
    const root=document.documentElement, meta=document.querySelector('meta[name="theme-color"]');
    const apply=m=>{root.setAttribute("data-theme",m);meta.content=m==="dark"?"#161b14":"#f9fafb";};
    apply(root.getAttribute("data-theme")||"dark");
    $("theme").addEventListener("click",()=>{
      const n=root.getAttribute("data-theme")==="dark"?"light":"dark";
      apply(n);try{localStorage.setItem("tema",n)}catch(e){}
    });
  })();
</script>
