<style>
  :root{
    --bg:#100a05; --red:#d62828; --red2:#a81c1c; --mustard:#ffc20e; --bun:#e9a24f;
    --card:rgba(16,10,5,.58); --text:#ffffff; --muted:#f1dba5; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:#100a05;overflow-x:clip}
  .bgfill{position:fixed;left:0;right:0;top:-80px;bottom:-240px;z-index:-1;pointer-events:none;background:radial-gradient(90% 60% at 50% 0%,rgba(255,194,14,.22) 0%,transparent 70%),radial-gradient(100% 70% at 50% 100%,rgba(214,40,40,.28) 0%,transparent 70%),linear-gradient(#1a1008,var(--bg));}
  body{
    background:transparent;
    color:var(--text); font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; justify-content:center; min-height:100vh; min-height:100dvh; overflow-x:clip;
    padding:calc(40px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  }
  #bg{position:fixed;left:-40px;top:-40px;z-index:0;pointer-events:none;filter:blur(2.5px)}
  .logo{width:clamp(210px,66vw,300px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
  main{position:relative;z-index:1;width:100%;max-width:440px;margin-block:auto;display:flex;flex-direction:column;align-items:center}

  .rise{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms + 100ms)}
  @keyframes rise{to{opacity:1;transform:none}}

  .brand{text-align:center;margin-bottom:26px}
  .emoji{font-size:2.6rem;line-height:1;display:block;margin-bottom:6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  h1{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(2.3rem,12vw,3.2rem);line-height:1;color:var(--mustard);
     text-shadow:0 3px 0 var(--red2),0 6px 18px rgba(0,0,0,.45);letter-spacing:.5px}
  .tag{margin-top:10px;font-weight:600;font-size:1rem;color:var(--text);text-shadow:0 2px 8px rgba(0,0,0,.6)}

  .links{list-style:none;width:100%;display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;gap:16px;width:100%;min-height:66px;padding:14px 18px;
    background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);
    border:1px solid rgba(255,230,180,.18);border-radius:var(--radius);color:var(--text);text-decoration:none;
    font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;
    box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
  @media (hover:hover){.btn:hover{transform:translateY(-3px);border-color:var(--mustard);box-shadow:0 12px 28px rgba(0,0,0,.35),0 0 0 1px rgba(252,191,73,.4)}}
  .btn.primary{background:linear-gradient(135deg,#ffd23f,#ffb400);color:#150d05;border-color:#000;box-shadow:0 8px 24px rgba(255,194,14,.35)}
  .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:rgba(252,191,73,.16);color:var(--mustard);flex-shrink:0}
  .btn.primary .ico{background:rgba(0,0,0,.14);color:#150d05}
  .ico svg{width:24px;height:24px}
  .txt{display:flex;flex-direction:column;min-width:0;flex-grow:1}
  .txt b{font-weight:700;font-size:clamp(.92rem,4.2vw,1.05rem);line-height:1.25}
  .txt span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn.primary .txt span{color:rgba(21,13,5,.8)}
  .go{width:20px;height:20px;color:rgba(255,230,180,.5);flex-shrink:0}
  .btn.done .ico{background:var(--mustard);color:var(--bg)}

  .address{margin-top:26px;text-align:center;font-style:normal;font-size:.85rem;line-height:1.6;color:var(--muted);text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .address strong{display:block;color:var(--text);font-weight:700;margin-bottom:2px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:10;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--mustard);color:var(--bg);font-size:.85rem;font-weight:700;padding:10px 18px;border-radius:999px;transition:opacity .3s,transform .3s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:360px){.btn{padding:12px 14px;gap:12px;min-height:60px}.ico{width:42px;height:42px}}
  @media (max-height:660px){body{padding-top:calc(24px + env(safe-area-inset-top))}.brand{margin-bottom:16px}.links{gap:10px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}
</style>

      {d:1.1,ty:()=>by-34*u,draw:y=>sausage(y)},
      {d:2.1,ty:()=>by+14*u,draw:y=>bun(y,540,58,"#f3bd68","#d78f3d","#a8631f")},
      {d:3.1,ty:()=>by-70*u,draw:y=>sauce(y,"#ffc20e",["#b8860b","rgba(255,255,255,.7)"],0,10)},
      {d:4,ty:()=>by-72*u,draw:y=>sauce(y,"#d62828",["#7a0f0f","rgba(255,200,200,.65)"],1,8)}
    ];
    for(let i=0;i<30;i++){
      const x=(rnd()-.5)*440, j=rnd()*14, k=i%3, a=rnd()*3;
      items.push({d:4.9+rnd()*1.5,ty:()=>by-(82+j)*u,draw:y=>{
        ctx.save(); ctx.translate(cx+x*u,y); ctx.rotate(a);
        if(k===0){ ctx.fillStyle="#f6eed8"; rr(-10*u,-3.5*u,20*u,7*u,3.5*u); }
        else if(k===1){ ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(0,0,5.5*u,0,7); }
        else { ctx.fillStyle="#5f9a3e"; ctx.beginPath(); ctx.arc(0,0,8*u,0,7); }
        ctx.fill(); ctx.restore(); }});
    }
    const DUR=1.4, HOLD=3.2, FADE=1, TOTAL=6.4+DUR+HOLD+FADE;
    function frame(t){
      ctx.clearRect(-PX,-PT,W+2*PX,H+PT+PB);
      const c=t%TOTAL; const ga=c>TOTAL-FADE?(TOTAL-c)/FADE:1;
      for(const it of items){
        const p=Math.min(1,Math.max(0,(c-it.d)/DUR)); if(p<=0) continue;
        const ty=it.ty(), y=ty-(1-p*p)*H*.95;
        ctx.save(); ctx.globalAlpha=ga*Math.min(1,p*3);
        ctx.shadowColor="rgba(0,0,0,.45)"; ctx.shadowBlur=18*u; ctx.shadowOffsetY=8*u;
        it.draw(y); ctx.restore();
      }
    }
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){ const f=()=>frame(6.4+DUR+.1); f(); addEventListener("resize",f); return; }
    const t0=performance.now();
    (function loop(n){ frame((n-t0)/1000); requestAnimationFrame(loop); })(t0);
  })();
</script>
</body>
